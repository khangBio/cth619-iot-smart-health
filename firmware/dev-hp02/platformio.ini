[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7.2.1
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit MPU6050@^2.2.6
build_src_filter = +<sketch.*>
[platformio]
src_dir = .
